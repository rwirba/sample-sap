{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "java-hello-world-chart.name" . }}-ingress
  labels:
    app: {{ include "java-hello-world-chart.name" . }}
  annotations:
    {{- if .Values.ingress.annotations }}
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: hello.mitechnology.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-hello-world
                port:
                  number: 80
{{- end }}