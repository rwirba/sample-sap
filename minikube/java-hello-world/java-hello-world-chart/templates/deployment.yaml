apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "java-hello-world.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: java-hello-world
  template:
    metadata:
      labels:
        app: java-hello-world
    spec:
      containers:
      - name: java-hello-world
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080

        volumeMounts:
        - name: data-volume
          mountPath: {{ .Values.persistence.mountPath }}

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 20     # Wait longer before first check
          periodSeconds: 15           # Check less frequently
          timeoutSeconds: 5           # Allow slower responses
          failureThreshold: 5         # Allow more missed probes
          successThreshold: 1

        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30     # Give app time to warm up
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
          successThreshold: 1

      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: {{ include "java-hello-world.name" . }}-pvc
