{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "java-hello-world.fullname" . }}-ingress
  labels:
    app: {{ include "java-hello-world.name" . }}
  annotations:
    {{- if .Values.ingress.annotations }}
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hello.mitechnology.org
      secretName: cloudflare-cert
  rules:
    - host: hello.mitechnology.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-hello-world
                port:
                  number: 80
{{- end }}