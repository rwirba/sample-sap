# -----------------------------------------------------------------------------
# Helm Values for java-hello-world
# -----------------------------------------------------------------------------

replicaCount: 2

image:
  repository: docker.io/ryandevlab/java-hello-world
  tag: "1.0.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

# -----------------------------------------------------------------------------
# Ingress configuration
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    # Allow both hello.local and direct IP access
    - host: hello.local
      paths:
        - path: /
          pathType: Prefix
    - host: ""  # Allows matching any host (e.g., raw EC2 IP)
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -----------------------------------------------------------------------------
# Ingress Controller defaults
# -----------------------------------------------------------------------------
ingressController:
  serviceType: NodePort
  host: hello.local

# -----------------------------------------------------------------------------
# Resource limits
# -----------------------------------------------------------------------------
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# -----------------------------------------------------------------------------
# Persistent storage
# -----------------------------------------------------------------------------
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data

# -----------------------------------------------------------------------------
# Image pull secrets (if private registry)
# -----------------------------------------------------------------------------
imagePullSecrets: []
