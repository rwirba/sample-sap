replicaCount: 2

image:
  repository: docker.io/ryandevlab/java-hello-world
  tag: "1.0.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: hello.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressController:
  serviceType: LoadBalancer
  host: hello.local
  
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data

imagePullSecrets: []