replicaCount: 2

image:
  repository: docker.io/ryandevlab/java-hello-world
  tag: "1.0.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

# ---------------------------------------------------------------------
# Ingress definition for NGINX controller.
# You can keep "hello.local" or leave host blank; NGINX will still route
# by path when host headers don't match.
# ---------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: hello.local         # optional; not used when accessing via EC2-IP
      paths:
        - path: /
          pathType: Prefix
  tls: []                       # no TLS yet (HTTP only)

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data

imagePullSecrets: []
