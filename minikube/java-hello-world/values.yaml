# -----------------------------------------------------------------------------
# Helm Values for java-hello-world
# -----------------------------------------------------------------------------

replicaCount: 2

image:
  repository: docker.io/ryandevlab/java-hello-world
  tag: "1.0.0"
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: 54.235.9.167.nip.io
      paths:
        - path: /
          pathType: Prefix

# -----------------------------------------------------------------------------
# Resource limits
# -----------------------------------------------------------------------------
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# -----------------------------------------------------------------------------
# Persistent storage
# -----------------------------------------------------------------------------
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data

# -----------------------------------------------------------------------------
# Image pull secrets (if private registry)
# -----------------------------------------------------------------------------
imagePullSecrets: []
