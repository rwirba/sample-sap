- name: Create mount directory
  file:
    path: "{{ minikube_mount_path }}"
    state: directory
    owner: ec2-user
    mode: '0777'

- name: Check if Minikube is already installed
  stat:
    path: /usr/local/bin/minikube
  register: minikube_installed

- name: Install Minikube
  get_url:
    url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
    dest: /usr/local/bin/minikube
    mode: '0755'
  when: not minikube_installed.stat.exists

- name: Check if Minikube is running
  shell: "minikube status | grep -q \"host: Running\""
  register: minikube_status
  ignore_errors: true
  changed_when: false

- name: Ensure clean Minikube state (optional cleanup)
  file:
    path: "{{ minikube_mount_path }}"
    state: absent
  become: true

- name: Start Minikube if not running
  command: >
    /usr/local/bin/minikube start --driver={{ minikube_driver }}
    --container-runtime={{ minikube_runtime }}
    --mount --mount-string="{{ minikube_mount_path }}:/var/lib/minikube"
    --cpus={{ req_cpus }} --memory={{ req_mem }} --disk-size={{ minikube_disk_size }} --force
  when: minikube_status.rc != 0
  become: true
  become_user: ec2-user

- name: Pull Minikube images into cache
  command: /usr/local/bin/minikube image pull {{ item }}
  loop:
    - kubernetesui/dashboard:v2.7.0
    - kubernetesui/metrics-scraper:v1.0.8
  become: true
  become_user: ec2-user

- name: Mark Minikube as started
  file:
    path: "{{ minikube_mount_path }}/.minikube_started"
    state: touch
  when: minikube_status.rc != 0

- name: Deploy autostart systemd unit
  template:
    src: "{{ minikube_autostart_template }}"
    dest: /etc/systemd/system/minikube-autostart.service
    mode: '0644'

- name: Enable autostart
  systemd:
    name: minikube-autostart.service
    enabled: true
    daemon_reload: true