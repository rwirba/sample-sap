- name: Copy dashboard creation script
  template:
    src: create_dashboard.sh
    dest: /tmp/create_dashboard.sh
    mode: '0755'

- name: Copy admin-user RBAC template
  template:
    src: admin-user-rbac.yaml.j2
    dest: /tmp/admin-user-rbac.yaml

- name: Execute dashboard creation script
  command: bash /tmp/create_dashboard.sh
