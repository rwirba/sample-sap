apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minikube-dashboard.name" . }}
  labels:
    app: kubernetes-dashboard
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: kubernetes-dashboard
  template:
    metadata:
      labels:
        app: kubernetes-dashboard
    spec:
      serviceAccountName: admin-user
      containers:
        - name: kubernetes-dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          args:
            - --namespace=demo
            - --enable-skip-login
            - --disable-settings-authorizer
            - --auto-generate-certificates
            - --token-ttl=43200
          volumeMounts:
            - name: kubernetes-dashboard-certs
              mountPath: /certs
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: kubernetes-dashboard-certs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
