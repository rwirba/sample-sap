apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  labels:
    app: kubernetes-dashboard
    app.kubernetes.io/managed-by: Helm
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: https
  selector:
    app: kubernetes-dashboard
