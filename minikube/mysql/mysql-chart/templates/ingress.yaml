apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mysql-ingress
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "TCP"
spec:
  ingressClassName: nginx
  rules:
    - host: mysql.ryandemolab.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mysql-db
                port:
                  number: 3306
