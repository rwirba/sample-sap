apiVersion: v1
kind: Service
metadata:
  name: {{ include "sap-hana.name" . }}
  labels:
    app: {{ include "sap-hana.name" . }}
spec:
  type: ClusterIP
  ports:
    - name: hana-tcp
      port: 39017
      targetPort: 39017
    - name: hana-http
      port: 51000
      targetPort: 51000
  selector:
    app: {{ include "sap-hana.name" . }}

