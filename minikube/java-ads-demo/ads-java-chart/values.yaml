replicaCount: 1

image:
  repository: docker.io/yourrepo/java-ads-demo
  tag: "1.0.0"
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ads.54.235.9.167.nip.io
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi 

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data

imagePullSecrets: []
