{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "java-ads-demo.fullname" . }}-ingress
  labels:
    app: {{ include "java-ads-demo.name" . }}
  annotations:
    {{- if .Values.ingress.annotations }}
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: nginx 
  tls:
    - hosts:
        - ads.mitechnology.org
      secretName: cloudflare-cert
  rules:
    - host: ads.mitechnology.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-ads-demo
                port:
                  number: 81
{{- end }}

