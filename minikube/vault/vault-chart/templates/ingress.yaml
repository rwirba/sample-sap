{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vault-demo.name" . }}-ingress
  labels:
    app: {{ include "vault-demo.name" . }}
  annotations:
    {{- if .Values.ingress.annotations }}
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: vault.ryandemolab.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault-demo
                port:
                  number: 8200
{{- end }}
