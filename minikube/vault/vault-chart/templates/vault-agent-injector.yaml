apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-agent-injector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault-agent-injector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-agent-injector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-agent-injector
    spec:
      serviceAccountName: {{ .Values.injector.serviceAccount }}
      containers:
        - name: vault-agent-injector
          image: "{{ .Values.injector.image.repository }}:{{ .Values.injector.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - "agent-inject"
            - "-log-level={{ .Values.injector.logLevel }}"
          env:
            - name: AGENT_INJECT_VAULT_ADDR
              value: "http://vault-demo.{{ .Release.Namespace }}.svc:8200"
            - name: AGENT_INJECT_VAULT_AUTH_PATH
              value: "auth/kubernetes"
            - name: AGENT_INJECT_VAULT_ROLE
              value: "hana-role"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 3
