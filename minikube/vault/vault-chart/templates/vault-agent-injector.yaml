{{- if .Values.injector.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-agent-injector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault-agent-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-agent-injector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-agent-injector
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # ensures redeploy when RBAC or env values change
        checksum/config: {{ include (print $.Template.BasePath "/vault-agent-rbac.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.injector.serviceAccount.name }}
      containers:
        - name: vault-agent-injector
          image: "{{ .Values.injector.image.repository }}:{{ .Values.injector.image.tag }}"
          imagePullPolicy: {{ .Values.injector.image.pullPolicy }}
          args:
            - "agent-inject"
            - "-log-level=info"
          env:
          {{- range .Values.injector.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.injector.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: vault-agent-injector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault-agent-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: vault-agent-injector
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-agent-injector-role
  labels:
    app.kubernetes.io/name: vault-agent-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-agent-injector-rolebinding
  labels:
    app.kubernetes.io/name: vault-agent-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-agent-injector-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.injector.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}

---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: vault-agent-injector-cfg
  labels:
    app.kubernetes.io/name: vault-agent-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
webhooks:
  - name: vault.hashicorp.com
    clientConfig:
      service:
        name: vault-agent-injector
        namespace: {{ .Release.Namespace }}
        path: "/mutate"
      caBundle: ""
    admissionReviewVersions: ["v1"]
    sideEffects: None
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    failurePolicy: Ignore
    matchPolicy: Equivalent
    namespaceSelector: {}
{{- end }}
