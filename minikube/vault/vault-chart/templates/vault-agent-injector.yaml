{{- if .Values.injector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-agent-injector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault-agent-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-agent-injector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-agent-injector
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # ensures Helm redeploys the pod when related templates change
        checksum/config: {{ include (print $.Template.BasePath "/vault-agent-rbac.yaml") . | sha256sum }}
    spec:
      serviceAccountName: vault-auth
      containers:
        - name: vault-agent-injector
          image: "hashicorp/vault-k8s:1.4.2"
          imagePullPolicy: IfNotPresent
          args:
            - "agent-inject"
            - "-log-level=info"
          env:
            - name: AGENT_INJECT_VAULT_ADDR
              value: "{{ .Values.injector.externalVaultAddr }}"
            - name: AGENT_INJECT_VAULT_AUTH_PATH
              value: "auth/kubernetes"
            - name: AGENT_INJECT_VAULT_ROLE
              value: "hana-role"
            - name: AGENT_INJECT_LOG_LEVEL
              value: "info"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vault-agent-injector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault-agent-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: vault-agent-injector
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-agent-injector-role
  labels:
    app.kubernetes.io/name: vault-agent-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-agent-injector-rolebinding
  labels:
    app.kubernetes.io/name: vault-agent-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-agent-injector-role
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: vault-agent-injector-cfg
  labels:
    app.kubernetes.io/name: vault-agent-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
webhooks:
  - name: vault.hashicorp.com
    clientConfig:
      service:
        name: vault-agent-injector
        namespace: {{ .Release.Namespace }}
        path: "/mutate"
      caBundle: ""
    admissionReviewVersions: ["v1"]
    sideEffects: None
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    failurePolicy: Ignore
    matchPolicy: Equivalent
    namespaceSelector: {}
{{- end }}
