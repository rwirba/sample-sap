apiVersion: batch/v1
kind: Job
metadata:
  name: vault-k8s-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      serviceAccountName: vault-auth
      restartPolicy: OnFailure
      containers:
        - name: vault-bootstrap
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command: ["/bin/bash", "/scripts/vault-bootstrap.sh"]
          env:
            - name: VAULT_ADDR
              value: "http://vault-demo.{{ .Release.Namespace }}.svc:8200"
          volumeMounts:
            - name: vault-bootstrap-script
              mountPath: /scripts
              readOnly: true
            - name: vault-storage
              mountPath: /vault/data
      volumes:
        - name: vault-bootstrap-script
          configMap:
            name: vault-k8s-bootstrap
            defaultMode: 0755
        - name: vault-storage
          hostPath:
            path: /data/vault
            type: DirectoryOrCreate
