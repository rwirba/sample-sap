replicaCount: 1

image:
  repository: docker.io/ryandevlab/dev-vault
  tag: "1.0.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8200
  targetPort: 8200

ingress:
  enabled: true
  className: nginx
  hostname: vault.ryandemolab.app
  tls:
    enabled: true
    secretName: cloudflare-cert
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /vault/data
  hostPath: /data/vault
