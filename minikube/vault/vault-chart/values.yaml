replicaCount: 1

image:
  repository: docker.io/ryandevlab/dev-vault
  tag: "1.0.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8200
  targetPort: 8200

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: vault.ryandemolab.app
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

injector:
  enabled: true
  serviceAccount:
    name: vault-auth
  image:
    repository: hashicorp/vault-k8s
    tag: "1.4.2"
    pullPolicy: IfNotPresent
  env:
    - name: AGENT_INJECT_VAULT_ADDR
      value: "http://vault-demo.demo.svc:8200"
    - name: AGENT_INJECT_VAULT_AUTH_PATH
      value: "auth/kubernetes"
    - name: AGENT_INJECT_VAULT_ROLE
      value: "hana-role"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /vault/data
  hostPath: /data/vault
