image:
  repository: aksdemoacr3.azurecr.io/java-ads
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  name: ""    

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: java-ads.ryandemolab.app
      paths:
        - path: /
          pathType: Exact
  tls: []  # Optional: add TLS config if using cert-manager

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70    
